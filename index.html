<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TF93 Furnace Hive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: in-game orientation (Y up, Furnace bottom-right), toolbar over a zoomable board, then move orders. Single dark look by choice. */
:root{
 --bg:#0f1524; --panel:#141c2f; --line:#26324f; --fg:#eef1f8; --mute:#93a0bd;
 --gold:#f4b73b; --mg:#e67ad8; --open:#3fd39b; --red:#ff6b6b;
 --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
 color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
h1{font-family:var(--display);font-size:clamp(26px,6vw,42px);margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:3px;display:inline-block;box-sizing:border-box}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.btn{font:600 14px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--mute)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.sq{width:40px;padding:0;font-size:20px}
.zl{font-family:var(--mono);font-size:13px;color:var(--mute);min-width:48px;text-align:center}
.sp{flex:1 1 0}
.msg{font-size:13px;color:var(--mute);min-height:1.5em}
.board{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:auto;max-height:78vh;touch-action:pan-x pan-y}
.board svg{display:block}
.board.edit .base{cursor:grab;touch-action:none}
.base{cursor:pointer}
.base.drag{cursor:grabbing}
.find{display:flex;gap:10px}
.find input{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;flex:1 1 auto;min-width:0}
.find input:focus-visible{outline:2px solid var(--gold)}
.card{border:1px solid var(--gold);border-radius:8px;padding:12px 14px;background:var(--panel);font-family:var(--mono);font-size:14px}
.card .n{font-family:var(--display);font-size:20px;font-weight:700}
h2{font-family:var(--display);font-size:20px;margin:0}
.notes{display:grid;gap:8px;max-width:78ch}
.notes div{display:flex;gap:10px;align-items:baseline}
.notes b.dot{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(1px)}
.sum{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--mono);font-size:13px;color:var(--mute)}
.sum b{color:var(--fg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:600px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--display);color:var(--mute);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:12px;background:var(--panel)}
td.c{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#1a2440}
.rk{font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:3px;color:#fff}
.st{font-size:12px;font-family:var(--mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.st.stay{color:var(--open);border-color:var(--open)}
.st.move{color:var(--gold);border-color:var(--gold)}
.st.far{color:var(--red);border-color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>TF93 · ALLIANCE HIVE FORMATION</h1>
 <p class="sub">Furnace (562, 4) · current-location lineup · in-game orientation (Y goes up) · MG plot and open slots</p>
</header>
<div class="legend" id="legend"></div>
<div class="bar">
 <button class="btn sq" id="zout" aria-label="Zoom out">−</button>
 <span class="zl" id="zl">100%</span>
 <button class="btn sq" id="zin" aria-label="Zoom in">+</button>
 <button class="btn" id="zfit">Fit</button>
 <button class="btn" id="edit" aria-pressed="false">Drag &amp; drop: off</button>
 <button class="btn" id="undo">Undo</button>
 <button class="btn" id="reset">Reset layout</button>
 <span class="sp"></span>
 <button class="btn" id="png">Download PNG</button>
</div>
<div class="msg" id="msg" role="status">Tip: Ctrl + scroll or pinch to zoom. Turn on drag &amp; drop to move bases; dropping on another base swaps them.</div>
<div class="board" id="board"><svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TF93 hive map"></svg></div>
<div class="find"><input id="q" type="search" placeholder="Find a member, e.g. MamaRudra" aria-label="Find a member" list="names"><datalist id="names"></datalist></div>
<div id="card" class="card" hidden></div>
<div class="notes" id="notes"></div>
<div style="display:grid;gap:10px">
 <h2>Move orders</h2>
 <div class="sum" id="sum"></div>
 <div class="tbl"><table><thead><tr><th>Member</th><th>Rank</th><th>Now</th><th>New spot</th><th>Order</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</div>

function status(m,to){if(m.far)return['far','Teleport in'];const d=Math.max(Math.abs(to[0]-m.x),Math.abs(to[1]-m.y));return d===0?['stay','Stay']:d<=2?['snap','Nudge '+d]:['move','Move '+d]}
function wrapName(n){const c=[...n.replace(/\s+/g,' ').trim()];if(c.length<=10)return[c.join('')];const a=c.slice(0,10).join(''),b=c.slice(10,19).join('');return[a,b+(c.length>19?'…':'')]}
function openSlots(){const used=new Set(Object.values(P).map(p=>p.join(',')));return D.hive.filter(s=>!used.has(s.join(','))&&!inMG(s))}
function draw(){
 svg.innerHTML='';
 el('rect',{x:0,y:0,width:W,height:H,fill:C.panel});
 for(let x=X0;x<=X1;x++)el('line',{x1:sx(x),y1:0,x2:sx(x),y2:sy(Y0),stroke:x%5?C.grid:C.grid5,'stroke-width':x%5?0.6:1});
 for(let y=Y0;y<=Y1;y++)el('line',{x1:sx(X0),y1:sy(y),x2:sx(X1),y2:sy(y),stroke:y%5?C.grid:C.grid5,'stroke-width':y%5?0.6:1});
 for(let x=530;x<=X1;x+=5)tx(svg,x,{x:sx(x),y:H-12,fill:C.mute,'font-size':12,'text-anchor':'middle','font-family':FM});
 for(let y=0;y<=30;y+=5)tx(svg,y,{x:PAD-6,y:sy(y)+4,fill:C.mute,'font-size':12,'text-anchor':'end','font-family':FM});
 D.neighbours.forEach(n=>{if(n.x+3<=X0||n.x>=X1||n.y>=Y1)return;const b=box(n.x,n.y);el('rect',{x:b.x+2,y:b.y+2,width:b.w-4,height:b.h-4,rx:6,fill:C.nb,'fill-opacity':.55});tx(svg,n.a||'no tag',{x:b.x+b.w/2,y:b.y+b.h/2+4,'text-anchor':'middle',fill:C.nbtx,'font-size':11,'font-family':FD})});
 const mb=box(MG.x0,MG.y0,MG.x1-MG.x0,MG.y1-MG.y0);el('rect',{x:mb.x+2,y:mb.y+2,width:mb.w-4,height:mb.h-4,rx:10,fill:C.mg,'fill-opacity':.12,stroke:C.mg,'stroke-dasharray':'8 6','stroke-width':2.5});
 [['MG PLOT',18,-14],['Marshal’s Guard',12,8],['keep EMPTY',12,24]].forEach(([s,f,dy])=>tx(svg,s,{x:mb.x+mb.w/2,y:mb.y+mb.h/2+dy,'text-anchor':'middle',fill:C.mg,'font-size':f,'font-weight':700,'font-family':FD}));
 openSlots().forEach(s=>{const b=box(s[0],s[1]);el('rect',{x:b.x+4,y:b.y+4,width:b.w-8,height:b.h-8,rx:7,fill:C.open,'fill-opacity':.08,stroke:C.open,'stroke-dasharray':'5 4','stroke-width':2});
  tx(svg,'OPEN',{x:b.x+b.w/2,y:b.y+b.h/2-2,'text-anchor':'middle',fill:C.open,'font-size':12,'font-weight':700,'font-family':FD});
  tx(svg,`(${s[0]},${s[1]})`,{x:b.x+b.w/2,y:b.y+b.h-12,'text-anchor':'middle',fill:C.open,'font-size':9,'font-family':FM})});
 const f=box(D.furnace[0],D.furnace[1]);el('rect',{x:f.x+2,y:f.y+2,width:f.w-4,height:f.h-4,rx:8,fill:C.furnace,stroke:'#ffb3ad','stroke-width':2});
 tx(svg,'TF93',{x:f.x+f.w/2,y:f.y+f.h/2,'text-anchor':'middle',fill:'#fff','font-size':15,'font-weight':700,'font-family':FD});
 tx(svg,'FURNACE',{x:f.x+f.w/2,y:f.y+f.h/2+16,'text-anchor':'middle',fill:'#ffffffb3','font-size':9,'font-family':FM});
 for(const n in P)drawBase(n);
}
function drawBase(n){const m=mem[n],p=P[n],b=box(p[0],p[1]);const on=!sel||sel===n;
 const g=el('g',{class:'base',tabindex:0,role:'button','aria-label':`${n} at ${p[0]}, ${p[1]}`,opacity:on?1:.3,'data-n':n});
 if(ATK.has(n))el('rect',{x:b.x+1,y:b.y+1,width:b.w-2,height:b.h-2,rx:9,fill:'none',stroke:C.gold,'stroke-width':3},g);
 el('rect',{x:b.x+5,y:b.y+5,width:b.w-10,height:b.h-10,rx:6,fill:C[m.r],stroke:sel===n?'#ffffff':'#ffffff33','stroke-width':sel===n?3:1},g);
 const L=wrapName(n);L.forEach((s,i)=>tx(g,s,{x:b.x+b.w/2,y:b.y+b.h/2-(L.length-1)*7+i*14-4,'text-anchor':'middle',fill:'#fff','font-size':11,'font-weight':600,'font-family':FB}));
 tx(g,`(${p[0]},${p[1]})`,{x:b.x+b.w/2,y:b.y+b.h-11,'text-anchor':'middle',fill:'#ffffffb3','font-size':9,'font-family':FM});
 const st=status(m,p)[0];if(st==='far'||st==='move')tx(g,st==='far'?'TP':'MV',{x:b.x+b.w-9,y:b.y+15,'text-anchor':'end','font-size':8,'font-weight':700,fill:st==='far'?'#ffd1d1':'#ffe7b0','font-family':FM});
 el('title',{},g).textContent=`${n} (${RN[m.r]}) now ${m.x},${m.y} → ${p[0]},${p[1]}`;
 g.addEventListener('pointerdown',e=>startDrag(e,g,n));
 g.addEventListener('keydown',e=>{if(e.key==='Enter')pick(n)});
}
// ---- drag & drop ----
let drag=null;
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function startDrag(e,g,n){
 if(!edit){return} e.preventDefault();
 const p0=svgPt(e);g.parentNode.appendChild(g);drag={g,n,p0,moved:false,id:e.pointerId};try{g.setPointerCapture(e.pointerId)}catch(_){}g.classList.add('drag');
}
svg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=svgPt(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;if(Math.hypot(dx,dy)>4)drag.moved=true;drag.g.setAttribute('transform',`translate(${dx},${dy})`);
 const r=board.getBoundingClientRect(),m=40;if(e.clientX>r.right-m)board.scrollLeft+=12;if(e.clientX<r.left+m)board.scrollLeft-=12;if(e.clientY>r.bottom-m)board.scrollTop+=12;if(e.clientY<r.top+m)board.scrollTop-=12});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.g.classList.remove('drag');
 if(!d.moved){d.g.removeAttribute('transform');pick(d.n);return}
 const p=svgPt(e),old=P[d.n];const dx=(p.x-d.p0.x)/S,dy=-(p.y-d.p0.y)/S;
 let nx=old[0]+dx,ny=old[1]+dy;nx=531+3*Math.round((nx-531)/3);ny=2+3*Math.round((ny-2)/3);
 nx=Math.max(X0,Math.min(X1-3,nx));ny=Math.max(Y0,Math.min(Y1-3,ny));
 if(nx===old[0]&&ny===old[1]){draw();return}
 if(blocked.some(b=>Math.abs(b[0]-nx)<3&&Math.abs(b[1]-ny)<3)){say('That spot is taken by the Furnace or another alliance. Base moved back.');draw();return}
 const other=Object.keys(P).find(k=>k!==d.n&&P[k][0]===nx&&P[k][1]===ny);
 const clash=Object.keys(P).find(k=>k!==d.n&&k!==other&&Math.abs(P[k][0]-nx)<3&&Math.abs(P[k][1]-ny)<3);
 if(clash){say(`Overlaps ${clash}. Base moved back.`);draw();return}
 hist.push(JSON.stringify(P));
 if(other){P[other]=old;say(`Swapped ${d.n} and ${other}.`)}else say(`${d.n} moved to (${nx}, ${ny}).`);
 P[d.n]=[nx,ny];sel=d.n;save();refresh()}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('click',e=>{if(edit)return;const g=e.target.closest('.base');if(g)pick(g.dataset.n)});
function say(t){document.getElementById('msg').textContent=t}
// ---- zoom ----
function setZoom(nz,cx,cy){nz=Math.max(.35,Math.min(3,nz));const r=board.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;
 const fx=(board.scrollLeft+cx)/(W*z),fy=(board.scrollTop+cy)/(H*z);z=nz;svg.setAttribute('width',W*z);svg.setAttribute('height',H*z);
 board.scrollLeft=fx*W*z-cx;board.scrollTop=fy*H*z-cy;document.getElementById('zl').textContent=Math.round(z*100)+'%'}
function fit(){const r=board.getBoundingClientRect();setZoom(Math.min((r.width-2)/W,1));board.scrollLeft=board.scrollWidth}
document.getElementById('zin').onclick=()=>setZoom(z*1.25);
document.getElementById('zout').onclick=()=>setZoom(z/1.25);
document.getElementById('zfit').onclick=fit;
board.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const r=board.getBoundingClientRect();setZoom(z*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let pinch=null;
board.addEventListener('touchstart',e=>{if(e.touches.length===2&&!drag){const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z}}},{passive:true});
board.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches,r=board.getBoundingClientRect();const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);setZoom(pinch.z*d/pinch.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)}},{passive:false});
board.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
// ---- edit controls ----
const eb=document.getElementById('edit');
eb.onclick=()=>{edit=!edit;eb.setAttribute('aria-pressed',edit);eb.textContent='Drag & drop: '+(edit?'on':'off');board.classList.toggle('edit',edit);say(edit?'Drag a base to a new spot. Drop it on another base to swap them.':'Drag & drop is off. Tap a base to see its details.')};
document.getElementById('undo').onclick=()=>{if(!hist.length){say('Nothing to undo.');return}P=JSON.parse(hist.pop());save();refresh();say('Last move undone.')};
const rb=document.getElementById('reset');let armed=false;
rb.onclick=()=>{if(!armed){armed=true;rb.textContent='Tap again to reset';say('This puts every base back to the original lineup.');setTimeout(()=>{armed=false;rb.textContent='Reset layout'},3000);return}
 armed=false;rb.textContent='Reset layout';hist.push(JSON.stringify(P));P=JSON.parse(JSON.stringify(BASE));save();refresh();say('Layout reset to the original lineup.')};
// ---- PNG export ----
document.getElementById('png').onclick=async()=>{
 const keep=sel;sel=null;draw();
 const clone=svg.cloneNode(true);clone.setAttribute('width',W);clone.setAttribute('height',H);clone.querySelectorAll('title').forEach(t=>t.remove());
 const src=new XMLSerializer().serializeToString(clone);sel=keep;draw();
 const img=new Image();const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml;charset=utf-8'}));
 img.onload=()=>{const k=2,HD=90,LG=40;const cv=document.createElement('canvas');cv.width=(W+40)*k;cv.height=(H+HD+LG+20)*k;const c=cv.getContext('2d');c.scale(k,k);
  c.fillStyle=C.bg;c.fillRect(0,0,W+40,H+HD+LG+20);
  c.fillStyle=C.fg;c.font='700 34px '+FD;c.fillText('TF93 · ALLIANCE HIVE FORMATION',20,46);
  c.fillStyle=C.mute;c.font='16px '+FB;c.fillText('Furnace (562, 4) · server 2093 · '+new Date().toISOString().slice(0,10),20,74);
  let lx=20;const ly=HD+14;[['R5',C.R5],['R4',C.R4],['R3',C.R3],['R2',C.R2],['R1',C.R1],['Unranked',C.UN],['Attack team',null,C.gold],['MG plot',null,C.mg],['Open slot',null,C.open]].forEach(([t,f,s])=>{
   if(f){c.fillStyle=f;c.fillRect(lx,ly-12,15,15)}else{c.strokeStyle=s;c.lineWidth=2.5;c.strokeRect(lx+1,ly-11,13,13)}c.fillStyle=s||C.fg;c.font='600 14px '+FB;c.fillText(t,lx+21,ly);lx+=c.measureText(t).width+44});
  c.drawImage(img,20,HD+LG,W,H);URL.revokeObjectURL(url);
  cv.toBlob(async b=>{const dl=window.claude?.use?await window.claude.use('downloads').catch(()=>null):null;
   if(dl){try{await dl.save({filename:'tf93-hive-map.png',data:b});say('PNG saved as tf93-hive-map.png.')}catch(err){say(err&&err.code==='declined'?'Download cancelled.':'Download is not available here.')}return}
   const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tf93-hive-map.png';document.body.appendChild(a);a.click();a.remove();say('PNG saved as tf93-hive-map.png.')},'image/png')};
 img.onerror=()=>say('Could not build the PNG in this browser.');img.src=url};
// ---- panels ----
function pick(n){sel=sel===n?null:n;document.getElementById('q').value=sel||'';card();draw()}
function card(){const c=document.getElementById('card');if(!sel){c.hidden=true;return}const m=mem[sel],p=P[sel],[k,l]=status(m,p);c.hidden=false;
 c.innerHTML=`<div class="n"></div><div>${RN[m.r]}${ATK.has(sel)?' · attack team':''} · now (${m.x}, ${m.y}) → <b style="color:var(--gold)">(${p[0]}, ${p[1]})</b> · ${l}</div>`;c.querySelector('.n').textContent=sel}
function table(){const ord={R5:0,R4:1,R3:2,R2:3,R1:4,UN:5};const tb=document.getElementById('tb');tb.innerHTML='';const cnt={stay:0,snap:0,move:0,far:0};
 D.members.slice().sort((a,b)=>ord[a.r]-ord[b.r]||a.n.localeCompare(b.n)).forEach(m=>{const p=P[m.n],[k,l]=status(m,p);cnt[k]++;const tr=document.createElement('tr');
  tr.innerHTML=`<td></td><td><span class="rk" style="background:${C[m.r]}">${RN[m.r]}</span></td><td class="c">${m.x}, ${m.y}</td><td class="c"><b>${p[0]}, ${p[1]}</b></td><td><span class="st ${k}">${l}</span></td>`;
  tr.firstChild.textContent=m.n+(ATK.has(m.n)?'  ★':'');tr.onclick=()=>{pick(m.n);board.scrollIntoView({behavior:'smooth',block:'center'})};tb.appendChild(tr)});
 const edited=Object.keys(P).filter(n=>P[n][0]!==BASE[n][0]||P[n][1]!==BASE[n][1]).length;
 document.getElementById('sum').innerHTML=`<span>Stay <b>${cnt.stay}</b></span><span>Nudge 1–2 tiles <b>${cnt.snap}</b></span><span>Move in hive <b>${cnt.move}</b></span><span>Teleport in <b>${cnt.far}</b></span><span>Open slots <b>${openSlots().length}</b></span><span>Changed by you <b>${edited}</b></span>`}
function refresh(){draw();table();card()}
document.getElementById('legend').innerHTML=['R5','R4','R3','R2','R1'].map(k=>`<span><i style="background:${C[k]}"></i>${k}</span>`).join('')+
 `<span><i style="background:${C.UN}"></i>Unranked</span><span style="color:var(--gold)"><i style="border:3px solid var(--gold)"></i>Attack team</span><span style="color:var(--mg)"><i style="border:2px dashed var(--mg)"></i>MG plot</span><span style="color:var(--open)"><i style="border:2px dashed var(--open)"></i>Open slot</span><span style="color:var(--mute)"><i style="background:${C.nb}"></i>Other alliance</span>`;
document.getElementById('notes').innerHTML=[
 [C.furnace,'Bottom-right is the Furnace, same as the game map. TWWH is right of it and INDe sits along the top edge of our hive.'],
 [C.gold,'Everyone keeps their current area, snapped to an exact spot: rows 2, 5, 8 … 29 and columns 531 … 558, plus column 561 under the Furnace.'],
 [C.mg,'MG plot top-left (X 531–539, Y 23–31) is already empty in the scan.'],
 [C.open,'Green OPEN spots are free grid slots for big players or new members.'],
 ['#ffd1d1','TP = teleport in from far away. MV = moves more than 2 tiles inside the hive.'],
 [C.mute,'Your drag & drop changes are saved in this browser only. Download a PNG to share the final layout.']
].map(([c,t])=>`<div><b class="dot" style="background:${c}"></b><span>${t}</span></div>`).join('');
const dl=document.getElementById('names');D.members.forEach(m=>{const o=document.createElement('option');o.value=m.n;dl.appendChild(o)});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();if(!v){sel=null;card();draw();return}const h=D.members.find(m=>m.n.toLowerCase()===v)||D.members.find(m=>m.n.toLowerCase().includes(v));if(h){sel=h.n;card();draw();const b=box(P[h.n][0],P[h.n][1]);board.scrollTo({left:b.x*z-board.clientWidth/2,top:b.y*z-board.clientHeight/2,behavior:'smooth'})}});
refresh();setZoom(1);board.scrollLeft=board.scrollWidth;board.scrollTop=board.scrollHeight;
</script>
